// ── Son : WAV généré en JS (lu via <audio>, plus fiable sur iPhone que WebAudio) ──
const makeWav = (pattern) => {
  const sr=22050, parts=[];
  pattern.forEach(([f,dur])=>{ const n=Math.floor(sr*dur); for(let i=0;i<n;i++){ const env=Math.min(1,i/200,(n-i)/200); let x=f?Math.sin(2*Math.PI*f*i/sr)+0.5*Math.sin(6*Math.PI*f*i/sr):0; x=Math.max(-0.8,Math.min(0.8,x))/0.8; parts.push(x*0.98*env); } });
  const buf=new ArrayBuffer(44+parts.length*2), v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF"); v.setUint32(4,36+parts.length*2,true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,parts.length*2,true);
  parts.forEach((s,i)=>v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*32767,true));
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
};
const SONS = {};
// « rappel » : bip-bip-bip réveil (2,4 kHz — perce le bruit grave des hottes)
// « urgent » : sirène rapide 2 tons, pour un temps de cellule dépassé
const getSon = (type) => {
  if(!SONS[type]){
    const p = type==="urgent"
      ? [[2600,.12],[1900,.12],[2600,.12],[1900,.12],[2600,.12],[1900,.12],[0,.08]]
      : [[2400,.13],[0,.07],[2400,.13],[0,.07],[2400,.13],[0,.07],[2400,.13],[0,.45]];
    const a=new Audio(makeWav(p)); a.preload="auto"; SONS[type]=a;
  }
  return SONS[type];
};
// Sonnerie en boucle jusqu'à intervention (comme un réveil)
let SONNERIE=null, VIBRE=null;
const startSonnerie = (type="rappel") => {
  if(SONNERIE===type) return;
  stopSonnerie();
  SONNERIE=type;
  try{ const a=getSon(type); a.loop=true; a.volume=1; a.currentTime=0; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  try{ if(navigator.vibrate){ const v=()=>{ try{ navigator.vibrate(type==="urgent"?[400,150,400,150,400]:[600,300,600]); }catch(e){} }; v(); VIBRE=setInterval(v,1600); } }catch(e){}
};
const stopSonnerie = () => {
  SONNERIE=null;
  ["rappel","urgent"].forEach(t=>{ try{ const a=SONS[t]; if(a){ a.loop=false; a.pause(); a.currentTime=0; } }catch(e){} });
  if(VIBRE){ clearInterval(VIBRE); VIBRE=null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
};
// Un seul passage (bouton « Tester le son »)
const playSon = (type="rappel") => {
  try{ const a=getSon(type); a.loop=false; a.currentTime=0; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
};
// iOS/Android : le son n'est autorisé qu'après un premier appui → on « déverrouille » au 1er toucher
const unlockSons = () => {
  ["rappel","urgent"].forEach(t=>{ try{ const a=getSon(t); if(SONNERIE===t){ a.muted=false; a.loop=true; const p=a.play(); if(p&&p.catch) p.catch(()=>{}); return; } a.muted=true; const p=a.play(); if(p&&p.then) p.then(()=>{ if(SONNERIE!==t){a.pause();a.currentTime=0;} a.muted=false;}).catch(()=>{a.muted=false;}); else a.muted=false; }catch(e){} });
};

const servicesDepuis = (iso, pl, now=new Date()) => {
  if(!iso) return null;
  const debut=new Date(iso); let n=0;
  const d=new Date(debut); d.setHours(0,0,0,0);
  while(d<=now){
    servicesDuJour(pl,d).forEach(s=>{
      const deb=new Date(d); deb.setHours(Math.floor(s.debut),Math.round((s.debut%1)*60),0,0);
      const fin=new Date(d); fin.setHours(Math.floor(s.fin),Math.round((s.fin%1)*60),0,0);
      if(fin>debut && deb<=now) n++; // service entamé après le changement
    });
    d.setDate(d.getDate()+1);
  }
  return n;
};
// Couleur attendue selon l'avancée du cycle (suggestion seulement — l'agent vérifie et corrige)
const huileSuggestion = (n, cycle) => {
  if(n==null) return { col:1, txt:"Aucun changement enregistré : vérifier à l'œil." };
  const r=n/cycle;
  const col = r<0.3?1 : r<0.7?2 : 3;
  const txt = r>=1 ? `Cycle atteint (${n}/${cycle} services) : changement d'huile conseillé.`
            : r>=0.7 ? `Fin de cycle proche (${n}/${cycle} services) : prévoir le changement.`
            : `${n}/${cycle} services depuis le changement.`;
  return { col, txt, r };
};

function AppMain({onLogout}){

  const [services,   setServices]  = useState([]);

  const [ready,      setReady]     = useState(false);
  const [syncing,    setSyncing]   = useState(false);
  const [fbOk,       setFbOk]      = useState(null);
  const [agents,     setAgents]    = useState(agentsLoad);
  const [fourns,     setFourns]    = useState(fournsLoad);
  const [unites,     setUnites]    = useState(unitesLoad);
  const [pndPlan,    setPndPlan]   = useState(pndLoad);
  const [cellPresets,setCellPresets]= useState(cellPresetsLoad);
  const [cellDlc,    setCellDlc]   = useState(cellDlcLoad);
  const [planning,   setPlanning]  = useState(planningLoad);
  const [alarmCfg,   setAlarmCfg]  = useState(alarmCfgLoad);
  const [alarms,     setAlarms]    = useState([]);
  const [acks,       setAcks]      = useState(()=>{ try{ return JSON.parse(localStorage.getItem("bc_alarm_acks")||"{}"); }catch(e){ return {}; } });

  useEffect(()=>{
    const pairs=[["temps",setTemps],["huiles",setHuiles],["nc",setNcs],["cellule",setCellules],["service",setServices],["nettoyage",setNettoyages]];
    const unsubs=pairs.map(([k,s])=>dbListen(k,s));
    // Firebase = source de vérité pour les agents
    // On écoute Firebase dès le départ et on écrase toujours le localStorage
    const unsubAgents = (() => {
      if(!db) return ()=>{};
      const ref = db.ref("haccp/agents");
      ref.once("value", snap => {
        try{
          const v = snap.val();
          if(v!=null){
            const parsed = JSON.parse(v);
            if(Array.isArray(parsed) && parsed.length>0){
              setAgents(parsed); // Firebase écrase le localStorage
              localStorage.setItem("bc_agents", JSON.stringify(parsed));
            }
          }
        }catch(e){}
      });
      // Puis écoute en temps réel les changements
      ref.on("value", snap => {
        try{
          const v = snap.val();
          if(v!=null){
            const parsed = JSON.parse(v);
            if(Array.isArray(parsed) && parsed.length>0){
              setAgents(parsed);
              localStorage.setItem("bc_agents", JSON.stringify(parsed));
            }
          }
        }catch(e){}
      });
      return () => ref.off();
    })();
    setReady(true);
    if(db){db.ref(".info/connected").on("value",snap=>{setFbOk(snap.val()===true);});}

    // ── Réglages partagés : boutons cellule, DLC surgélation, planning ──
    const shared=[["cellPresets2","bc_cell_presets_v2",v=>Array.isArray(v)&&v.length&&setCellPresets(v)],
                  ["cellDlc","bc_cell_dlc",v=>{const n=parseInt(v); if(n>0) setCellDlc(n);}],
                  ["planning","bc_planning",v=>v&&v.jours&&setPlanning(v)],
                  ["huileCycle","bc_huile_cycle",()=>{}]];
    const unsubShared=shared.map(([k,lsk,set])=>{
      if(!db) return ()=>{};
      const ref=db.ref("haccp/"+k);
      ref.on("value",snap=>{ try{ const raw=snap.val(); if(raw==null) return; const v=JSON.parse(raw); set(v); localStorage.setItem(lsk,typeof v==="object"?JSON.stringify(v):String(v)); }catch(e){} });
      return ()=>ref.off();
    });
    // Le son n'est autorisé qu'après un 1er appui (iPhone / Android)
    const unlock=()=>{ unlockSons(); document.removeEventListener("pointerdown",unlock); };
    document.addEventListener("pointerdown",unlock);
    if("Notification" in window && Notification.permission==="default"){ try{ Notification.requestPermission(); }catch(e){} }
    return()=>{unsubs.forEach(fn=>fn()); unsubAgents(); unsubShared.forEach(fn=>fn()); document.removeEventListener("pointerdown",unlock);};
  },[]);
  const save=async(key,set,data)=>{set(data);lsSave(key,data);setSyncing(true);await dbSave(key,data);setSyncing(false);};
  const saveAgents=(arr)=>{setAgents(arr);agentsSave(arr);};

  const saveUnites=(arr)=>{setUnites(arr);unitesSave(arr);};
  const savePnd=(arr)=>{setPndPlan(arr);pndSave(arr);};
  // Cellule : chaque modification s'applique sur la version serveur la plus récente (transaction Firebase)
  const patchCellules=(fn)=>{
    setCellules(prev=>{ const n=fn(prev||[]); lsSave("cellule",n); return n; });
    if(db){
      setSyncing(true);
      db.ref("haccp/cellule").transaction(cur=>{
        let arr=null; try{ arr=cur?JSON.parse(cur):null; }catch(e){}
        if(!Array.isArray(arr)) arr=lsLoad("cellule")||[];
        return JSON.stringify(fn(arr));
      }).then(()=>setSyncing(false)).catch(()=>setSyncing(false));

  };
  const saveCellPresets=(arr)=>{setCellPresets(arr);cellPresetsSave(arr);};
  const saveCellDlc=(n)=>{setCellDlc(n);cellDlcSave(n);};
  const savePlanning=(p)=>{setPlanning(p);planningSave(p);};
  const saveAlarmCfg=(c)=>{setAlarmCfg(c);alarmCfgSave(c);};
  const saveAcks=(o)=>{ // purge > 3 jours
    const lim=Date.now()-3*864e5; const n={}; Object.entries(o).forEach(([k,v])=>{ const d=Date.parse(k.split("_")[0]); if(!(d&&d<lim)) n[k]=v; });
    setAcks(n); try{ localStorage.setItem("bc_alarm_acks",JSON.stringify(n)); }catch(e){}
  };

  // ── MOTEUR D'ALARMES : vérifie toutes les 15 s, sonne à chaque nouvelle alarme puis toutes les 30 s tant que non acquittée ──
  const dataRef=React.useRef({});
  dataRef.current={cellules,temps,nettoyages,cfg:alarmCfg,planning,acks};
  useEffect(()=>{
    const check=()=>setAlarms(calcAlarmes(dataRef.current));
    check(); const i=setInterval(check,15000);
    return()=>{ clearInterval(i); stopSonnerie(); };
  },[]);
  // Sonnerie : démarre à chaque nouvelle alarme et tourne en boucle tant qu'il reste une alarme non traitée
  const ringRef=React.useRef("");
  useEffect(()=>{
    const keys=alarms.map(a=>a.key);
    if(!keys.length){ ringRef.current=""; stopSonnerie(); return; }
    const avant=ringRef.current.split("|");
    const nouvelle=alarms.find(a=>!avant.includes(a.key));
    ringRef.current=keys.join("|");
    const type=alarms.some(a=>a.niveau==="urgent")?"urgent":"rappel";
    if(nouvelle){ stopSonnerie(); notifier(nouvelle.titre,nouvelle.txt); }
    startSonnerie(type);
  },[alarms]);
  // Recalcul immédiat quand une donnée change (relevé fait → l'alarme disparaît)
  useEffect(()=>{ setAlarms(calcAlarmes(dataRef.current)); },[cellules,temps,nettoyages,alarmCfg,planning,acks]);

  // ── Écran toujours allumé (option) ──
  useEffect(()=>{
    if(!alarmCfg.wake||!("wakeLock" in navigator)) return;
    let lock=null; let stop=false;
    const get=async()=>{ try{ if(document.visibilityState==="visible"&&!stop) lock=await navigator.wakeLock.request("screen"); }catch(e){} };
    get(); const onVis=()=>get(); document.addEventListener("visibilitychange",onVis);
    return()=>{ stop=true; document.removeEventListener("visibilitychange",onVis); try{ lock&&lock.release(); }catch(e){} };
  },[alarmCfg.wake]);

  const ackAlarm=async(a)=>{
    stopSonnerie();
    if(a.cycleId){ // acquittement stocké dans le cycle → synchronisé
      patchCellules(list=>list.map(c=>c.id===a.cycleId&&!(c.vus||[]).includes(a.jalon)?{...c,vus:[...(c.vus||[]),a.jalon]}:c));
    } else saveAcks({...acks,[a.key]:true});
  };
  const snoozeAlarm=(a)=>{ stopSonnerie(); saveAcks({...acks,[a.key]:Date.now()+30*60000}); };
  const goAlarm=(a)=>{ stopSonnerie(); if(a.tab==="cellule") ackAlarm(a); else snoozeAlarm(a); goTo(a.tab); };
  const logout=()=>{localStorage.removeItem("bc_auth");setAuthed(false);};

  // Raccourci : navigate + ouvre le formulaire
  const goTo=(t)=>{ setAutoOpen(true); setTab(t); setTimeout(()=>setAutoOpen(false),500); };

  if(!ready) return(
    <div style={{background:"#1e293b",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
      <div style={{color:"#f59e0b",fontFamily:"monospace",fontSize:20,letterSpacing:2}}>CHARGEMENT…</div>
      <div style={{fontSize:15,color:"#94a3b8"}}>Connexion en cours</div>
    </div>
  );

  const TABS=[
    {id:"dash",      icon:"◉",  short:"Accueil"},
    {id:"temps",     icon:"🌡", short:"Frigos"},
    {id:"service",   icon:"🔥", short:"Chaud"},
    {id:"huiles",    icon:"⚗",  short:"Huile"},
    {id:"cellule",   icon:"❄",  short:"Cellule"},
    {id:"nettoyage", icon:"🧹", short:"Ménage"},
    {id:"nc",        icon:"⚠",  short:"Problème"},
    {id:"settings",  icon:"⚙",  short:"Réglages"},
  ];

  return(
    <div style={{background:"#f1f5f9",minHeight:"100vh",maxWidth:480,margin:"0 auto"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

        body{font-size:18px;}
        .ifield{background:#0f1318;border:2px solid #2d3748;color:#f1f5f9;padding:14px 16px;border-radius:12px;font-family:inherit;font-size:17px;width:100%;}
        .ifield:focus{outline:none;border-color:#f59e0b;}
        .ifield::placeholder{color:#4a5568;}
        .chip{padding:14px 10px;border:2px solid #2d3748;background:transparent;border-radius:12px;color:#718096;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:all .15s;text-align:center;min-height:52px;}
        .chip.on{border-color:#f59e0b;background:#1a1300;color:#f59e0b;}
        .chip.green{border-color:#22c55e;background:#071810;color:#22c55e;}
        .chip.red{border-color:#ef4444;background:#1a0505;color:#ef4444;}
        .row{border-bottom:1px solid #1a202c;padding:14px 0;}
        .row:last-child{border-bottom:none;}
        .card{background:#0f1318;border:1px solid #1c2130;border-radius:16px;padding:18px;}
        .btnP{background:#f59e0b;color:#0a0c10;border:none;padding:18px;border-radius:14px;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;width:100%;letter-spacing:.5px;transition:all .15s;min-height:58px;}
        .btnP:disabled{opacity:.35;cursor:not-allowed;}
        .btnP:active{transform:scale(.97);}
        .btnS{background:#0f1318;color:#a0aec0;border:2px solid #2d3748;padding:11px 16px;border-radius:11px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:46px;}
        .btnEdit{background:transparent;border:1.5px solid #2d3748;color:#718096;padding:8px 12px;border-radius:9px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;min-height:40px;}
        .btnEdit:hover{border-color:#f59e0b;color:#f59e0b;background:#1a1300;}
        .btnDel{background:transparent;border:1.5px solid #1c2130;color:#4a5568;padding:8px 10px;border-radius:9px;font-family:inherit;font-size:14px;cursor:pointer;transition:all .15s;min-height:40px;}
        .btnDel:hover{border-color:#ef4444;color:#ef4444;background:#1a0505;}
        .tabBar{display:flex;background:#0a0c10;border-bottom:2px solid #1a202c;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
        .tabBar::-webkit-scrollbar{display:none;}
        .tabBtn{flex:0 0 auto;padding:10px 14px;background:transparent;border:none;border-bottom:3px solid transparent;color:#4a5568;cursor:pointer;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;transition:all .15s;white-space:nowrap;}
        .tabBtn.active{border-bottom-color:#f59e0b;color:#f59e0b;}
        .pulseR{animation:pR 1.5s infinite;}
        @keyframes pR{0%,100%{opacity:1;}50%{opacity:.3;}}
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
        .modal{background:#ffffff;border:1px solid #e2e8f0;border-top:3px solid #f59e0b;border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:22px 18px 44px;}
        .modalHandle{width:44px;height:5px;background:#2d3748;border-radius:3px;margin:0 auto 18px;}
        .pndRow{background:#0f1318;border:2px solid #1c2130;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s;}

        .shortcut{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;border:none;cursor:pointer;width:100%;font-family:inherit;font-weight:800;font-size:18px;transition:all .15s;min-height:70px;}

        .subLabel{font-size:14px;color:#64748b;margin-bottom:10px;line-height:1.5;}
        /* ── LIGHT THEME ── */

        .chip.on{border-color:#f59e0b !important;background:#fffbeb !important;color:#92400e !important;}
        .chip.green{border-color:#22c55e !important;background:#f0fdf4 !important;color:#15803d !important;}
        .chip.red{border-color:#ef4444 !important;background:#fef2f2 !important;color:#dc2626 !important;}
        .row{border-bottom:1px solid #e2e8f0;}
        .card{background:#ffffff !important;border:1px solid #e2e8f0 !important;box-shadow:0 1px 6px rgba(0,0,0,.07);}
        .btnS{background:#ffffff !important;color:#475569 !important;border:2px solid #cbd5e1 !important;}
        .btnEdit{border:1.5px solid #cbd5e1 !important;color:#64748b !important;background:#fff !important;}
        .btnEdit:hover{border-color:#f59e0b !important;color:#92400e !important;background:#fffbeb !important;}
        .btnDel{border:1.5px solid #fecaca !important;color:#ef4444 !important;background:#fff !important;}
        .btnDel:hover{border-color:#dc2626 !important;background:#fef2f2 !important;}
        .tabBar{background:#ffffff !important;border-bottom:2px solid #e2e8f0 !important;}
        .tabBtn{color:#64748b !important;}
        .tabBtn.active{border-bottom-color:#f59e0b !important;color:#92400e !important;}

        .modalHandle{background:#e2e8f0 !important;}
        .pndRow{background:#ffffff !important;border:2px solid #e2e8f0 !important;}
        .pndRow.done{border-color:#22c55e !important;background:#f0fdf4 !important;}
        select.ifield option{background:#ffffff !important;color:#1e293b !important;}
        ::-webkit-scrollbar-thumb{background:#cbd5e1 !important;}
        /* Forcer tous les textes principaux à être lisibles */
        .card *:not(button):not(input):not(select):not(textarea){ color: inherit; }
      `}</style>

      {/* HEADER */}
      <div style={{background:"#ffffff",borderBottom:"2px solid #e2e8f0",padding:"12px 18px",position:"sticky",top:0,zIndex:100,display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 1px 8px rgba(0,0,0,.06)"}}>
        <div>
          <div style={{fontSize:11,color:"#94a3b8",letterSpacing:3,textTransform:"uppercase",fontWeight:700,background:"#ffffff"}}>HACCP · Traçabilité</div>
          <div style={{fontSize:24,fontWeight:900,color:"#1e293b",lineHeight:1.1,letterSpacing:.5}}>{RESTAURANT}</div>
        </div>

          {syncing&&<div className="spin" style={{width:16,height:16,border:"2.5px solid #e2e8f0",borderTopColor:"#f59e0b",borderRadius:"50%"}}/>}
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:fbOk===true?"#22c55e":fbOk===false?"#ef4444":"#f59e0b"}}/>
            <span style={{fontSize:10,color:fbOk===true?"#22c55e":fbOk===false?"#ef4444":"#f59e0b",fontWeight:800}}>{fbOk===true?"SYNC":fbOk===false?"LOCAL":"..."}</span>
          </div>
          <Clock/>

      </div>

      {/* TABS */}
      <div className="tabBar" style={{position:"sticky",top:58,zIndex:99}}>
        {TABS.map(t=>(
          <button key={t.id} className={`tabBtn${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
            <div style={{fontSize:18,lineHeight:1,marginBottom:2}}>{t.icon}</div>
            <div>{t.short}</div>
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{padding:"16px 16px 60px"}}>
        <AlarmBanner alarms={alarms} onAck={ackAlarm} onSnooze={snoozeAlarm} onGo={goAlarm}/>
        {tab==="dash"      && <Dashboard temps={temps} huiles={huiles} ncs={ncs} cellules={cellules} services={services} nettoyages={nettoyages} planning={planning} onShortcut={goTo}/>}
        {tab==="temps"     && <ModuleTemps    temps={temps}        agents={agents} unites={unites} autoOpen={autoOpen} onShortcut={goTo} onSave={d=>save("temps",    setTemps,    d)}/>}
        {tab==="service"   && <ModuleService  services={services}  agents={agents} onShortcut={goTo} onSave={d=>save("service",  setServices, d)}/>}
        {tab==="huiles"    && <ModuleHuiles   huiles={huiles}      agents={agents} planning={planning} onSave={d=>save("huiles",   setHuiles,   d)}/>}
        {tab==="cellule"   && <ModuleCellule  cellules={cellules}  agents={agents} presets={cellPresets} dlcJours={cellDlc} onShortcut={goTo} onPatch={patchCellules}/>}
        {tab==="nettoyage" && <ModuleNettoyage nettoyages={nettoyages} agents={agents} pndPlan={pndPlan} autoOpen={autoOpen} onSave={d=>save("nettoyage",setNettoyages,d)}/>}
        {tab==="nc"        && <ModuleNC       ncs={ncs}            agents={agents} autoOpen={autoOpen} onSave={d=>save("nc",       setNcs,      d)}/>}
        {tab==="settings"  && <ModuleSettings agents={agents} onSaveAgents={saveAgents} fourns={fourns} onSaveFourns={saveFourns} unites={unites} onSaveUnites={saveUnites} pndPlan={pndPlan} onSavePnd={savePnd} cellPresets={cellPresets} onSaveCellPresets={saveCellPresets} cellDlc={cellDlc} onSaveCellDlc={saveCellDlc} planning={planning} onSavePlanning={savePlanning} alarmCfg={alarmCfg} onSaveAlarmCfg={saveAlarmCfg} onLogout={onLogout}/>}
      </div>
    </div>
  );
}

function Clock(){
  const [t,setT]=useState(new Date());
  useEffect(()=>{const i=setInterval(()=>setT(new Date()),15000);return()=>clearInterval(i);},[]);
  return(
    <div style={{textAlign:"right"}}>
      <div style={{fontSize:12,color:"#94a3b8",fontWeight:600}}>{t.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}</div>
      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:19,fontWeight:700,color:"#1e293b",lineHeight:1}}>
        {t.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════

// ── Helpers export CSV mensuel ──
const buildCSV=(rows,cols,maps)=>{
  if(!rows.length) return null;
  const csv=[cols.join(","),...rows.map(r=>cols.map(k=>`"${String((maps[k]?.(r))??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  return "\uFEFF"+csv;
};
const dlAll=async(temps,huiles,services,cellules,ncs,setCsvReady)=>{
  const moisPrec=new Date(); moisPrec.setDate(0);
  const mois=`${moisPrec.getFullYear()}-${String(moisPrec.getMonth()+1).padStart(2,'0')}`;
  const inM=(iso)=>{
    if(!iso) return false;
    if(typeof iso==="number"){
      const d=new Date(iso);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===mois;
    }
    return String(iso).startsWith(mois);
  };
  const nomMois=new Date(moisPrec.getFullYear(),moisPrec.getMonth(),1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const fichiers=[
    [temps.filter(t=>inM(t.ts)),
     ["Date","Heure","Unité","Temp (°C)","Conforme","Agent","Note"],
     {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),"Unité":r=>r.unite,"Temp (°C)":r=>r.temp,Conforme:r=>r.ok?"OUI":"NON",Agent:r=>r.agent,Note:r=>r.note||""},
     `temperatures_${mois}.csv`],
    [services.filter(s=>inM(s.ts)),
     ["Date","Heure","Poste","Plat","Temp (°C)","Conforme (≥63°C)","Agent"],
     {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),Poste:r=>r.poste,Plat:r=>r.plat||"—","Temp (°C)":r=>r.temp,"Conforme (≥63°C)":r=>r.ok?"OUI":"NON",Agent:r=>r.agent},
     `service_chaud_${mois}.csv`],
    [huiles.filter(h=>inM(h.ts)),
     ["Date","Heure","Friteuse","TPM (%)","Couleur","Odeur","Mousse","Décision","Agent"],
     {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),Friteuse:r=>r.friteuse,"TPM (%)":r=>r.tpm??"—",Couleur:r=>r.col,Odeur:r=>r.odeur,Mousse:r=>r.mousse,"Décision":r=>r.decision,Agent:r=>r.agent},
     `huiles_${mois}.csv`],
    [cellules.filter(c=>inM(c.tsDebut)&&c.statut==="terminé"),
     ["Date","Mode","Début","Fin","Produit","T° départ","T° fin","Durée (min)","Conforme","DLC","Agent"],
     {Date:r=>fDate(r.tsDebut),Mode:r=>cellMode(r).label,"Début":r=>fTime(r.tsDebut),Fin:r=>r.tsFin?fTime(r.tsFin)+(r.finCorrigee?" (a posteriori)":""):"—",Produit:r=>r.produit+(r.precision?" — "+r.precision:""),"T° départ":r=>r.tDepart??"—","T° fin":r=>r.tFin??"—","Durée (min)":r=>r.dureeMin??"—",Conforme:r=>r.ok?"OUI":"NON",DLC:r=>r.dlc?fDate(r.dlc):"",Agent:r=>r.agent},
     `cellule_${mois}.csv`],
    [ncs.filter(n=>inM(n.ts)),
     ["Date","Heure","Catégorie","Description","Action corrective","Agent","Statut"],
     {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),"Catégorie":r=>r.categorie,Description:r=>r.description,"Action corrective":r=>r.action||"",Agent:r=>r.agent,Statut:r=>r.statut},
     `nonconformites_${mois}.csv`],
  ];
  // Générer le ZIP avec JSZip
  const zip=new JSZip();
  let nbFichiers=0;
  fichiers.forEach(([rows,cols,maps,name])=>{
    const csv=buildCSV(rows,cols,maps);
    if(!csv) return;
    zip.file(name,csv); nbFichiers++;
  });
  // Diagnostic : compter toutes les données dispo par mois
  const moisCourant=`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  const totalData=temps.length+huiles.length+services.length+cellules.length+ncs.length;
  if(nbFichiers===0){
    const moisDispos=[...new Set([
      ...temps.map(r=>r.ts?.slice(0,7)),
      ...services.map(r=>r.ts?.slice(0,7)),
      ...huiles.map(r=>r.ts?.slice(0,7)),
    ].filter(Boolean))].sort();
    const msg=`Aucune donnée pour ${nomMois} (recherche : ${mois}).\n\n`+
      `Total en base : ${totalData} enregistrements.\n`+
      (moisDispos.length ? `Mois disponibles : ${moisDispos.join(", ")}\n\n` : "Aucun mois trouvé.\n\n")+
      `Voulez-vous exporter le mois en cours (${moisCourant}) à la place ?`;
    if(window.confirm(msg)){
      // Re-exécuter avec mois courant
      const moisAlt=moisCourant;
      const inMAlt=(iso)=>iso&&iso.startsWith(moisAlt);
      const zip2=new JSZip(); let n2=0;
      fichiers.forEach(([rows,cols,maps,name])=>{
        const rowsAlt=rows.filter?rows:rows; // déjà filtré plus haut, recalculer
      });
      // Recalcul propre avec le mois courant
      const fichiersAlt=[
        [temps.filter(t=>inMAlt(t.ts)),
         ["Date","Heure","Unité","Temp (°C)","Conforme","Agent","Note"],
         {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),"Unité":r=>r.unite,"Temp (°C)":r=>r.temp,Conforme:r=>r.ok?"OUI":"NON",Agent:r=>r.agent,Note:r=>r.note||""},
         `temperatures_${moisAlt}.csv`],
        [services.filter(s=>inMAlt(s.ts)),
         ["Date","Heure","Poste","Plat","Temp (°C)","Conforme (≥63°C)","Agent"],
         {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),Poste:r=>r.poste,Plat:r=>r.plat||"—","Temp (°C)":r=>r.temp,"Conforme (≥63°C)":r=>r.ok?"OUI":"NON",Agent:r=>r.agent},
         `service_chaud_${moisAlt}.csv`],
        [huiles.filter(h=>inMAlt(h.ts)),
         ["Date","Heure","Friteuse","TPM (%)","Couleur","Odeur","Mousse","Décision","Agent"],
         {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),Friteuse:r=>r.friteuse,"TPM (%)":r=>r.tpm??"—",Couleur:r=>r.col,Odeur:r=>r.odeur,Mousse:r=>r.mousse,"Décision":r=>r.decision,Agent:r=>r.agent},
         `huiles_${moisAlt}.csv`],
        [cellules.filter(c=>inMAlt(c.tsDebut)&&c.statut==="terminé"),
         ["Date","Mode","Début","Fin","Produit","T° départ","T° fin","Durée (min)","Conforme","DLC","Agent"],
         {Date:r=>fDate(r.tsDebut),Mode:r=>cellMode(r).label,"Début":r=>fTime(r.tsDebut),Fin:r=>r.tsFin?fTime(r.tsFin)+(r.finCorrigee?" (a posteriori)":""):"—",Produit:r=>r.produit+(r.precision?" — "+r.precision:""),"T° départ":r=>r.tDepart??"—","T° fin":r=>r.tFin??"—","Durée (min)":r=>r.dureeMin??"—",Conforme:r=>r.ok?"OUI":"NON",DLC:r=>r.dlc?fDate(r.dlc):"",Agent:r=>r.agent},
         `cellule_${moisAlt}.csv`],
        [ncs.filter(n=>inMAlt(n.ts)),
         ["Date","Heure","Catégorie","Description","Action corrective","Agent","Statut"],
         {Date:r=>fDate(r.ts),Heure:r=>fTime(r.ts),"Catégorie":r=>r.categorie,Description:r=>r.description,"Action corrective":r=>r.action||"",Agent:r=>r.agent,Statut:r=>r.statut},
         `nonconformites_${moisAlt}.csv`],
      ];
      fichiersAlt.forEach(([rows,cols,maps,name])=>{ const csv=buildCSV(rows,cols,maps); if(csv){zip2.file(name,csv);n2++;} });
      if(n2===0){ alert("Aucune donnée non plus pour le mois courant."); return; }
      const nomMoisAlt=new Date().toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
      const zipNameAlt=`HACCP_BlackCat_${moisAlt}.zip`;
      const blobAlt=await zip2.generateAsync({type:"blob"});
      const aAlt=document.createElement("a"); aAlt.href=URL.createObjectURL(blobAlt); aAlt.download=zipNameAlt; aAlt.click();
      if(setCsvReady) setCsvReady({zipName:zipNameAlt,nomMois:nomMoisAlt});
      setTimeout(()=>{
        const sujet=encodeURIComponent(`HACCP The Black Cat — Relevés ${nomMoisAlt}`);

        window.location.href=`mailto:${EMAIL_1},${EMAIL_2}?subject=${sujet}&body=${corps}`;
      },1500);
    }
    return;
  }
  const blob=await zip.generateAsync({type:"blob"});
  const zipName=`HACCP_BlackCat_${mois}.zip`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=zipName; a.click();
  if(setCsvReady) setCsvReady({zipName,nomMois});

    );

};

function ModuleTemps({temps,onSave,autoOpen,agents,unites:unitesProp,onShortcut}){
  const [mode,setMode]=useState("saisie");
  const UNITES_INIT=unitesLoad(); const [uid,setUid]=useState(UNITES_INIT[0]?.id||"saladette");
  const [temp,setTemp]=useState("");
  const [agent,setAgent]=useState((agents||AGENTS_DEFAULT)[0]);
  const [note,setNote]=useState("");
  const [flash,setFlash]=useState(null);
  const [edit,setEdit]=useState(null);
  const [lastId,setLastId]=useState(null);
  const [noteFlash,setNoteFlash]=useState(false);

  useEffect(()=>{ if(autoOpen) setMode("saisie"); },[autoOpen]);
  useEffect(()=>{ if(agents&&agents.length) setAgent(agents[0]); },[agents]);

  const UNITES=unitesProp||UNITES_DEFAULT;
  const u=UNITES.find(x=>x.id===uid)||UNITES[0];
  const ok=temp!==""?isOK(u,temp):null;
  const tAuj=temps.filter(t=>sameKDay(t.ts));

  const nextUnit=()=>{
    const idx=UNITES.findIndex(x=>x.id===uid);
    setUid(UNITES[(idx+1)%UNITES.length].id);
  };
  const submit=async()=>{
    if(!temp) return;
    const id=Date.now();
    await onSave([...temps,{id,ts:ts(),unite:u.label,uid:u.id,type:u.type,temp:parseFloat(temp),ok,agent,note:""}]);
    const wasOk=ok; setTemp(""); setLastId(id);
    setFlash(wasOk?"ok":"nc");
    setTimeout(()=>{ setFlash(null); nextUnit(); },1600);
  };
  const last=lastId?temps.find(t=>t.id===lastId):null;
  const addNote=async()=>{ if(!last||!note.trim()) return; await onSave(temps.map(t=>t.id===last.id?{...t,note:[t.note,note.trim()].filter(Boolean).join(" · ")}:t)); setNote(""); setNoteFlash(true); setTimeout(()=>setNoteFlash(false),2000); };
  const saveEdit=async(upd)=>{ await onSave(temps.map(t=>t.id===upd.id?upd:t)); setEdit(null); };
  const del=async(id)=>{ if(window.confirm("Supprimer ce relevé ?")) await onSave(temps.filter(t=>t.id!==id)); };

            <button className="btnP" onClick={submit} disabled={!temp}

            </button>

            <div style={{fontSize:13,color:"#94a3b8",textTransform:"uppercase",letterSpacing:1.2,fontWeight:800,marginTop:4}}>Relevés d'aujourd'hui ({tAuj.length})</div>

          note={note} setNote={setNote} onNote={addNote} noteFlash={noteFlash} onNC={()=>onShortcut&&onShortcut("nc")}
          extra={<button onClick={()=>nextUnit()} style={{background:"transparent",border:"2px solid #cbd5e1",borderRadius:12,color:"#64748b",fontFamily:"inherit",fontSize:15,fontWeight:700,padding:"12px",cursor:"pointer",width:"100%",minHeight:52}}>
            ⏭ Passer {u.label} — non relevé
          </button>}/>
      </>)}
      {mode==="hist"&&(
        <div className="card">
          {temps.length===0?<Empty/>:temps.slice().reverse().map(t=>(
            <div key={t.id} className="row" style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1,minWidth:0}}>

                  <span style={{fontSize:15,fontWeight:700}}>{t.unite}</span><Dot ok={t.ok}/>
                </div>
                <div style={{fontSize:13,color:"#94a3b8"}}>{fDT(t.ts)} · {t.agent}</div>
                {t.note&&<div style={{fontSize:13,color:"#f59e0b",marginTop:2}}>📝 {t.note}</div>}
              </div>
              <ABtns onEdit={()=>setEdit(t)} onDel={()=>del(t.id)}/>
            </div>
          ))}
        </div>
      )}
      {edit&&<Modal title="✏️ Modifier ce relevé" onClose={()=>setEdit(null)}>
        <EditTemps item={edit} agents={agents} onSave={saveEdit} onClose={()=>setEdit(null)}/>
      </Modal>}
    </div>
  );
}
function EditTemps({item,onSave,onClose,agents}){
  const UNITES=unitesLoad();

  </>);
}

// MODULE HUILES
// ══════════════════════════════════════════════
function ModuleHuiles({huiles,onSave,agents,planning}){
  const [mode,setMode]=useState("saisie");
  const [frit,setFrit]=useState("Friteuse 1");
  const [cycle,setCycleS]=useState(huileCycleLoad);
  const setCycle=(n)=>{ setCycleS(n); huileCycleSave(n); };
  const [tpm,setTpm]=useState(""); const [col,setCol]=useState(1);
  const [touche,setTouche]=useState(false); // l'agent a modifié la suggestion
  const [odeur,setOdeur]=useState("OK"); const [mousse,setMousse]=useState("Non");
  const [agent,setAgent]=useState((agents||AGENTS_DEFAULT)[0]);
  const [flash,setFlash]=useState(false); const [edit,setEdit]=useState(null);
  const [flashChange,setFlashChange]=useState(false);
  const d=huileDecision(tpm,col,odeur,mousse);

  // Dernier changement par friteuse
  const lastChange=(friteuse)=>{
    const changes=huiles.filter(h=>h.type==="changement"&&h.friteuse===friteuse);
    if(!changes.length) return null;
    return changes.sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
  };

  const lcF=lastChange(frit);
  const nServ=servicesDepuis(lcF&&lcF.ts, planning||PLANNING_DEFAULT);
  const sug=huileSuggestion(nServ, cycle);
  // Pré-remplissage à chaque changement de friteuse / de cycle (tant que l'agent n'a rien modifié)
  useEffect(()=>{ if(!touche){ setCol(sug.col); setOdeur("OK"); setMousse("Non"); } },[frit, sug.col, touche]);
  const choisir=(fn)=>(v)=>{ setTouche(true); fn(v); };
  const submit=async()=>{
    const tv=parseFloat(tpm);
    await onSave([...huiles,{id:Date.now(),ts:ts(),type:"controle",friteuse:frit,tpm:isNaN(tv)?null:tv,col,odeur,mousse,decision:d,agent,methode:isNaN(tv)?"Visuel + odeur":"TPM + visuel",services:nServ}]);
    setTpm(""); setTouche(false);
    setFlash(true); setTimeout(()=>setFlash(false),2000);
  };

  const enregistrerChangement=async()=>{
    await onSave([...huiles,{id:Date.now(),ts:ts(),type:"changement",friteuse:frit,agent,tpm:0,col:1,odeur:"OK",mousse:"Non",decision:"Changement effectué"}]);
    setFlashChange(true); setTimeout(()=>setFlashChange(false),3000);
  };

  const saveEdit=async(upd)=>{ await onSave(huiles.map(h=>h.id===upd.id?upd:h)); setEdit(null); };
  const del=async(id)=>{ if(window.confirm("Supprimer ?")) await onSave(huiles.filter(h=>h.id!==id)); };
  const csv=()=>dlCSV(huiles.map(h=>({"Date":fDate(h.ts),"Heure":fTime(h.ts),"Type":h.type==="changement"?"CHANGEMENT HUILE":"Contrôle","Friteuse":h.friteuse,"Méthode":h.type==="controle"?(h.methode||"TPM + visuel"):"—","TPM (%)":h.type==="controle"&&h.tpm!=null?h.tpm:"—","Couleur":h.type==="controle"?h.col:"—","Odeur":h.type==="controle"?h.odeur:"—","Décision":h.decision,"Agent":h.agent})),`huiles_${new Date().toISOString().slice(0,10)}.csv`);

  const lc=lastChange(frit);
  const controles=huiles.filter(h=>h.type!=="changement");

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <R2><span style={{fontSize:28,fontWeight:900,color:"#1e293b"}}>⚗ Huiles de friture</span><button className="btnS" onClick={csv}>↓ CSV</button></R2>
      <div style={{background:"#f0f7ff",border:"1px solid #93c5fd",borderRadius:12,padding:"12px 14px",fontSize:15,color:"#1e293b",fontWeight:600,lineHeight:1.5}}>
        ⚖️ Contrôle <b>visuel + odeur</b> à chaque service. Huile foncée, odeur rance/brûlée ou mousse = <b style={{color:"#dc2626"}}>changement immédiat</b> (limite légale : 25 % de composés polaires).
      </div>
      <TBar opts={[{id:"saisie",label:"📝 Contrôle"},{id:"hist",label:`📋 Historique (${controles.length})`}]} active={mode} onChange={setMode}/>

      {mode==="saisie"&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {/* Sélection friteuse + info dernier changement */}
          <div className="card" style={{display:"flex",flexDirection:"column",gap:10}}>
            <FB label="Quelle friteuse ?"><ChipR opts={["Friteuse 1","Friteuse 2"]} active={frit} onChange={setFrit}/></FB>
            <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:"10px 14px",fontSize:13}}>
              {lc?(
                <span style={{color:"#64748b"}}>🔄 Dernier changement <b style={{color:"#1e293b"}}>{frit}</b> : <b>{fDate(lc.ts)}</b> à {fTime(lc.ts)} · {lc.agent}</span>
              ):(
                <span style={{color:"#94a3b8"}}>🔄 Aucun changement enregistré pour {frit}</span>
              )}
            </div>
          </div>

          {/* BOUTON CHANGEMENT — mis en avant */}
          <button onClick={enregistrerChangement}
            style={{background:flashChange?"#22c55e":"#1e293b",border:"none",borderRadius:14,padding:"18px",color:"#fff",fontFamily:"inherit",fontSize:18,fontWeight:900,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all .2s"}}>
            <span style={{fontSize:24}}>🔄</span>
            {flashChange?"✅ Changement d'huile enregistré !":"J'ai changé l'huile de "+frit}
          </button>
          <div style={{fontSize:12,color:"#94a3b8",textAlign:"center",marginTop:-8}}>Appuyer ici dès que vous vidangez et remplacez l'huile</div>

          {/* Cycle de l'huile */}
          <div className="card" style={{display:"flex",flexDirection:"column",gap:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <div style={{fontSize:13,color:"#64748b",textTransform:"uppercase",letterSpacing:1.2,fontWeight:800}}>Cycle de l'huile — {frit}</div>

              {flash?"✅ Contrôle enregistré !":d==="Changement immédiat"?"💾 Enregistrer — huile à changer":"💾 Vérifié — enregistrer le contrôle"}
            </button>

              <summary style={{fontSize:14,color:"#64748b",fontWeight:700,cursor:"pointer"}}>J'ai un testeur TPM (facultatif)</summary>
              <input type="number" inputMode="decimal" step="1" min="0" max="40" className="ifield" value={tpm} onChange={e=>setTpm(e.target.value)} placeholder="TPM en %"

      {mode==="hist"&&(

// ══════════════════════════════════════════════
// MODULE CELLULE — multi-cycles · lancement en 1 appui · refroidissement / surgélation
// ══════════════════════════════════════════════
const minDepuis = (iso, now=Date.now()) => Math.max(0, Math.floor((now - new Date(iso)) / 60000));
const fDuree = (m) => m < 60 ? `${m} min` : `${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`;
const cellOk = (mode, tFin, dureeMin) => {
  const t = parseFloat(tFin); if (isNaN(t)) return null;
  const m = CELL_MODES[mode==="surgel"?"surgel":"refroid"];
  return t <= m.cible && (dureeMin == null || dureeMin <= m.limite);
};
const addDays = (iso, n) => { const d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString(); };

function ModuleCellule({cellules, onPatch, agents, presets, dlcJours, onShortcut}){
  const [mode, setMode] = useState("lancer");
  const [agent, setAgentS] = useState(() => { const a = localStorage.getItem("bc_cell_agent"); return (agents||AGENTS_DEFAULT).includes(a) ? a : (agents||AGENTS_DEFAULT)[0]; });
  const setAgent = (a) => { setAgentS(a); try{ localStorage.setItem("bc_cell_agent", a); }catch(e){} };
  const [ask, setAsk] = useState(null);     // preset qui demande un nom (Plat du jour / Autre)
  const [askName, setAskName] = useState("");
  const [msg, setMsg] = useState(null);     // {type:"ok"|"warn"|"err", txt}
  const [confirm5, setConfirm5] = useState(null);
  const [edit, setEdit] = useState(null);
  const [, tick] = useState(0);
  const dbl = React.useRef({id: null, t: 0});
  useEffect(() => { const i = setInterval(() => tick(x => x + 1), 15000); return () => clearInterval(i); }, []);

  const enCours = cellules.filter(c => c.statut === "en_cours");
  const modeActif = enCours.length ? (enCours[0].mode === "surgel" ? "surgel" : "refroid") : null;
  const termines = cellules.filter(c => c.statut === "terminé");
  const flash = (type, txt, ms=3500) => { setMsg({type, txt}); setTimeout(() => setMsg(null), ms); };

  const lancer = async (p, nom, force=false) => {
    const m = p.mode === "surgel" ? "surgel" : "refroid";
    if (modeActif && modeActif !== m) {
      flash("err", `Impossible : la cellule est en ${CELL_MODES[modeActif].label.toLowerCase()}. Un seul programme à la fois — clôture d'abord ${enCours.length>1?"les cycles en cours":"le cycle en cours"}.`, 6000);
      return;
    }
    if (!force && enCours.length >= CELL_CAPACITE) { setConfirm5({p, nom}); return; }
    // Anti double-appui : même produit lancé il y a moins de 2 min → il faut réappuyer dans les 8 s
    const dernier = enCours.find(c => c.presetId === p.id && minDepuis(c.tsDebut) < 2);
    if (!force && dernier && !p.ask && !(dbl.current.id === p.id && Date.now() - dbl.current.t < 8000)) {
      dbl.current = {id: p.id, t: Date.now()};
      flash("warn", `${p.label} est déjà en cellule depuis ${fTime(dernier.tsDebut)}. Pour lancer un 2e bac, appuie encore une fois.`, 8000);
      return;
    }
    dbl.current = {id: null, t: 0};
    const id = Date.now();
    const c = { id, tsDebut: ts(), tsFin: null, produit: nom || p.label, presetId: p.id, mode: m, qte: "", lot: "",
      tDepart: null, tFin: null, dureeMin: null, ok: null, statut: "en_cours", agent, deviceId: DEVICE_ID, vus: [] };
    onPatch(list => [...list, c]);
    setAsk(null); setAskName(""); setConfirm5(null);
    flash("ok", `▶ ${CELL_MODES[m].label} lancé : ${c.produit} — alarme sur cet appareil à ${fDuree(Math.round(CELL_MODES[m].limite/2))} et ${fDuree(CELL_MODES[m].limite-15)}`);
  };
  const tap = (p) => {
    if (p.ask) { setAsk(p); setAskName(""); return; }
    lancer(p);
  };
  const majCycle = (id, patch) => onPatch(list => list.map(c => c.id === id ? {...c, ...patch} : c));
  const del = (id) => { if (window.confirm("Supprimer ce cycle ?")) onPatch(list => list.filter(c => c.id !== id)); };
  const saveEdit = (upd) => { onPatch(list => list.map(c => c.id === upd.id ? upd : c)); setEdit(null); };

  const csv = () => dlCSV(termines.map(c => ({"Date":fDate(c.tsDebut),"Mode":cellMode(c).label,"Début":fTime(c.tsDebut),"Fin":c.tsFin?fTime(c.tsFin):"—","Fin saisie a posteriori":c.finCorrigee?"OUI":"","Produit":c.produit+(c.precision?" — "+c.precision:""),"T° départ":c.tDepart??"—","T° fin":c.tFin??"—","Durée (min)":c.dureeMin??"—","Conforme":c.ok===true?"OUI":c.ok===false?"NON":"—","DLC":c.dlc?fDate(c.dlc):"","Agent":c.agent})), `cellule_${new Date().toISOString().slice(0,10)}.csv`);

  const presetsRef = presets.filter(p => p.mode !== "surgel");
  const presetsSurg = presets.filter(p => p.mode === "surgel");
  const Grille = ({liste, m}) => {
    const M = CELL_MODES[m]; const bloque = modeActif && modeActif !== m;
    return (
      <div style={{display:"grid", gridTemplateColumns:"repeat(3,minmax(0,1fr))", gap:8, opacity:bloque?.4:1}}>
        {liste.map(p => (
          <button key={p.id} onClick={() => tap(p)}
            style={{minHeight:86, padding:"10px 6px", borderRadius:14, border:`2px solid ${M.border}`, background:M.bg, color:"#1e293b", fontFamily:"inherit", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:4}}>
            <span style={{fontSize:30, lineHeight:1}}>{p.icon || M.icon}</span>
            <span style={{fontSize:14, fontWeight:800, lineHeight:1.15, textAlign:"center"}}>{p.label}</span>
          </button>
        ))}
      </div>
    );
  };

  return (
    <div style={{display:"flex", flexDirection:"column", gap:16}}>
      <R2><span style={{fontSize:28, fontWeight:900, color:"#1e293b"}}>❄ Cellule</span><button className="btnS" onClick={csv}>↓ CSV</button></R2>

      {msg && (
        <div style={{position:"sticky", top:120, zIndex:50, borderRadius:12, padding:"12px 14px", fontWeight:800, fontSize:15, lineHeight:1.4,
          background:msg.type==="ok"?"#f0fdf4":msg.type==="warn"?"#fffbeb":"#fef2f2",
          border:`2px solid ${msg.type==="ok"?"#22c55e":msg.type==="warn"?"#f59e0b":"#ef4444"}`,
          color:msg.type==="ok"?"#15803d":msg.type==="warn"?"#92400e":"#dc2626"}}>{msg.txt}</div>
      )}

      {/* ── CYCLES EN COURS ── */}
      {enCours.length > 0 && (
        <div style={{display:"flex", flexDirection:"column", gap:10}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
            <div style={{fontSize:13, color:"#64748b", textTransform:"uppercase", letterSpacing:1.2, fontWeight:800}}>En cellule — {CELL_MODES[modeActif].label}</div>
            <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:14, fontWeight:700, color:enCours.length>CELL_CAPACITE?"#dc2626":"#64748b"}}>{enCours.length}/{CELL_CAPACITE} bacs</div>
          </div>
          {enCours.slice().sort((a,b)=>new Date(a.tsDebut)-new Date(b.tsDebut)).map(c => (
            <CycleCard key={c.id} c={c} dlcJours={dlcJours} onUpdate={patch => majCycle(c.id, patch)} onDel={() => del(c.id)} onShortcut={onShortcut}/>
          ))}
        </div>
      )}

      <TBar opts={[{id:"lancer", label:"▶ Lancer"}, {id:"hist", label:`📋 Historique (${termines.length})`}]} active={mode} onChange={setMode}/>

      {mode === "lancer" && (
        <div className="card" style={{display:"flex", flexDirection:"column", gap:16}}>
          <FB label="Qui lance ?"><ChipR opts={agents||AGENTS_DEFAULT} active={agent} onChange={setAgent}/></FB>
          <div>
            <label className="fieldLabel" style={{color:"#0369a1"}}>❄ Refroidissement</label>
            <div className="subLabel"><b>+63°C → ≤ +10°C en 2 h.</b> Un appui = le cycle démarre. Alarmes à 1 h et 1 h 45.</div>
            <Grille liste={presetsRef} m="refroid"/>
          </div>
          <div>
            <label className="fieldLabel" style={{color:"#6d28d9"}}>🧊 Surgélation</label>
            <div className="subLabel"><b>→ ≤ −18°C à cœur, 4 h 30 max.</b> Alarmes à 2 h 15 et 4 h 15. Jamais en même temps qu'un refroidissement.</div>
            <Grille liste={presetsSurg} m="surgel"/>
          </div>
          <div style={{fontSize:13, color:"#94a3b8", lineHeight:1.5}}>Liste modifiable dans ⚙ Réglages › Cellule.</div>
        </div>
      )}

      {mode === "hist" && (
        <div className="card">
          {termines.length === 0 ? <Empty/> : termines.slice().reverse().map(c => {
            const M = cellMode(c);
            return (
              <div key={c.id} className="row" style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10}}>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}><Dot ok={c.ok}/><span style={{fontSize:15, fontWeight:700}}>{c.produit}{c.precision&&` — ${c.precision}`}</span><span style={{fontSize:12, fontWeight:800, color:M.color}}>{M.icon} {M.short}</span></div>
                  <div style={{fontSize:13, color:"#94a3b8"}}>{fDate(c.tsDebut)} · {fTime(c.tsDebut)}→{c.tsFin?fTime(c.tsFin):"?"}{c.finCorrigee&&" (saisie a posteriori)"} · {c.agent}</div>
                  <div style={{fontSize:13, color:"#64748b", marginTop:2}}>Départ <b style={{color:"#92400e"}}>{c.tDepart!=null?`${c.tDepart}°C`:"—"}</b> → Fin <b style={{color:c.ok?"#22c55e":"#ef4444"}}>{c.tFin}°C</b>{c.dureeMin!=null&&<span style={{color:c.dureeMin<=M.limite?"#22c55e":"#ef4444"}}> · {fDuree(c.dureeMin)}{c.dureeMin>M.limite&&" ⚠ dépassé"}</span>}</div>
                  {c.dlc && <div style={{fontSize:13, color:"#6d28d9", marginTop:2, fontWeight:700}}>À consommer avant le {fDate(c.dlc)}</div>}
                </div>
                <ABtns onEdit={() => setEdit(c)} onDel={() => del(c.id)}/>
              </div>
            );
          })}
        </div>
      )}

      {ask && (
        <Modal title={`${ask.icon} ${ask.label} — ${CELL_MODES[ask.mode==="surgel"?"surgel":"refroid"].label}`} onClose={() => setAsk(null)}>
          <FB label="Nom du produit"><input className="ifield" autoFocus value={askName} onChange={e => setAskName(e.target.value)} onKeyDown={e => e.key==="Enter" && askName.trim() && lancer(ask, askName.trim())} placeholder="ex. Blanquette de veau"/></FB>
          <button className="btnP" disabled={!askName.trim()} onClick={() => lancer(ask, askName.trim())}>▶ Lancer le cycle</button>
        </Modal>
      )}
      {confirm5 && (
        <Modal title="⚠ Cellule pleine ?" onClose={() => setConfirm5(null)}>
          <div style={{fontSize:16, color:"#1e293b", lineHeight:1.5}}>Il y a déjà <b>{enCours.length} bacs</b> en cours. La Tecnodom a <b>{CELL_CAPACITE} niveaux GN1/1</b> : au-delà, l'air circule mal et les produits refroidissent moins vite.</div>
          <div style={{display:"flex", gap:12}}>
            <button onClick={() => setConfirm5(null)} style={{flex:1, padding:14, background:"transparent", border:"2px solid #cbd5e1", borderRadius:12, color:"#64748b", fontFamily:"inherit", fontSize:16, fontWeight:700, cursor:"pointer", minHeight:52}}>Annuler</button>
            <button className="btnP" style={{flex:2}} onClick={() => lancer(confirm5.p, confirm5.nom, true)}>Lancer quand même</button>
          </div>
        </Modal>
      )}
      {edit && <Modal title="✏️ Modifier cycle cellule" onClose={() => setEdit(null)}><EditCellule item={edit} agents={agents} onSave={saveEdit} onClose={() => setEdit(null)}/></Modal>}
    </div>
  );
}

// Carte d'un cycle en cours : minuteur, T° départ facultative, clôture juste sous la saisie
function CycleCard({c, dlcJours, onUpdate, onDel, onShortcut}){
  const M = cellMode(c);
  const [tFin, setTFin] = useState("");
  const [tDep, setTDep] = useState(c.tDepart != null ? String(c.tDepart) : "");
  const [heureSortie, setHeureSortie] = useState("");
  const [prec, setPrec] = useState(c.precision || "");
  const [done, setDone] = useState(null);
  const el = minDepuis(c.tsDebut);
  const enRetard = el > M.limite + 15;   // cycle oublié : on demande l'heure réelle de sortie
  const ici = c.deviceId === DEVICE_ID;

  // Heure de sortie réelle (cycle oublié) → date complète entre le début et maintenant
  const finReelle = () => {
    if (!enRetard || !heureSortie) return { iso: ts(), corr: false };
    const [hh, mm] = heureSortie.split(":").map(Number);
    const deb = new Date(c.tsDebut); const d = new Date(deb); d.setHours(hh, mm, 0, 0);
    if (d < deb) d.setDate(d.getDate() + 1);
    if (d > new Date()) return { iso: null, corr: true };
    return { iso: d.toISOString(), corr: true };
  };
  const fr = finReelle();
  const dureeFin = fr.iso ? Math.round((new Date(fr.iso) - new Date(c.tsDebut)) / 60000) : null;
  const okPreview = tFin !== "" ? cellOk(c.mode, tFin, dureeFin) : null;

  const cloturer = async () => {
    if (tFin === "" || !fr.iso) return;
    const dureeMin = dureeFin;
    const ok = cellOk(c.mode, tFin, dureeMin);
    const patch = { tsFin: fr.iso, tFin: parseFloat(tFin), dureeMin, ok, statut: "terminé", finCorrigee: fr.corr || undefined,
      tDepart: tDep !== "" ? parseFloat(tDep) : c.tDepart };
    if (c.mode === "surgel") patch.dlc = addDays(fr.iso, dlcJours);
    setDone({ ok, dlc: patch.dlc, tsFin: fr.iso });
    setTimeout(() => onUpdate(patch), 2600);
  };

  if (done) return (
    <div style={{background:done.ok?"#f0fdf4":"#fef2f2", border:`3px solid ${done.ok?"#22c55e":"#ef4444"}`, borderRadius:16, padding:16}}>

// Calcule les alarmes dues à l'instant t (pure, testable)
const calcAlarmes = ({cellules, temps, nettoyages, cfg, planning, acks, now=new Date()}) => {
  const out = [];
  if (!cfg.on) return out;
  // Cellule : seulement les cycles lancés depuis CET appareil
  if (cfg.cellule) {
    cellules.filter(c => c.statut === "en_cours" && c.deviceId === DEVICE_ID).forEach(c => {
      const M = cellMode(c); const el = minDepuis(c.tsDebut, now.getTime());
      const j = cellJalons(M).filter(j => el >= j.at).pop();
      if (!j) return;
      const key = `c_${c.id}_${j.k}`;
      if ((c.vus || []).includes(j.k) || acks[key]) return;
      out.push({ key, cycleId: c.id, jalon: j.k, tab: "cellule", niveau: j.k === "over" ? "urgent" : "rappel",
        titre: `${M.icon} ${c.produit} — ${j.titre}`, txt: `${fDuree(el)} en cellule · ${j.txt} (cible ${M.cibleTxt})`, cta: "Aller à la cellule" });
    });
  }
  const jour = kitchenDay(now);
  const hn = hDec(now);
  const okPlanning = (h) => !cfg.horaires || enService(planning, now) || hn - h < 1.5; // tolérance juste après un créneau
  const snoozed = (k) => acks[k] && acks[k] > now.getTime();
  const acked = (k) => acks[k] === true;
  if (cfg.temps) {
    const nAuj = temps.filter(t => sameKDay(t.ts)).length;
    // seul le dernier créneau échu compte (pas de « relevé du midi » affiché le soir)
    creneauxTemps(planning, now).filter(cr => hn >= cr.h).slice(-1).forEach(cr => {
      const key = `${jour}_${cr.id}`;
      if (hn >= cr.h && nAuj < cr.need && okPlanning(cr.h) && !acked(key) && !snoozed(key))
        out.push({ key, tab: "temps", niveau: "rappel", snooze: true, titre: `🌡 ${cr.label} à faire`, txt: `Prévu à ${fH(cr.h)} · ${nAuj} relevé${nAuj>1?"s":""} aujourd'hui — minimum 2 par jour.`, cta: "Faire le relevé" });
    });
  }
  if (cfg.menage) {
    const pndJour = (pndLoad() || PND_DEFAULT).filter(p => p.freq === "Journalier");
    const fait = pndJour.filter(p => nettoyages.some(n => sameKDay(n.ts) && n.tacheId === p.id)).length;
    creneauxMenage(planning, now).forEach(cr => {
      const key = `${jour}_${cr.id}`;
      if (hn >= cr.h && fait < pndJour.length && okPlanning(cr.h) && !acked(key) && !snoozed(key))
        out.push({ key, tab: "nettoyage", niveau: "rappel", snooze: true, titre: `🧹 ${cr.label}`, txt: `${pndJour.length - fait} tâche${pndJour.length-fait>1?"s":""} du jour pas encore validée${pndJour.length-fait>1?"s":""}.`, cta: "Valider le ménage" });
    });
  }
  return out.sort((a,b)=>(b.niveau==="urgent")-(a.niveau==="urgent"));
};

          <div style={{fontSize:13, color:CELL_MODES[m].color, textTransform:"uppercase", letterSpacing:1.2, fontWeight:900, marginBottom:6}}>{CELL_MODES[m].icon} {CELL_MODES[m].label}</div>
          {presets.filter(p => (p.mode === "surgel" ? "surgel" : "refroid") === m).map(p => (
            <div key={p.id} className="row" style={{display:"flex", alignItems:"center", gap:8}}>
              <span style={{fontSize:24, width:32, textAlign:"center"}}>{p.icon}</span>
              <span style={{flex:1, fontSize:16, fontWeight:700}}>{p.label}{p.ask && <span style={{fontSize:12, color:"#94a3b8"}}> · nom demandé</span>}</span>
              <button className="btnEdit" onClick={() => move(p.id, -1)}>↑</button>
              <button className="btnEdit" onClick={() => move(p.id, 1)}>↓</button>
              <button className="btnDel" onClick={() => rm(p.id)}>✕</button>
            </div>
          ))}
        </div>
      ))}
      <div className="card" style={{display:"flex", flexDirection:"column", gap:10}}>
        <div style={{fontSize:13, color:"#64748b", textTransform:"uppercase", letterSpacing:1.2, fontWeight:800}}>🧊 Durée de conservation après surgélation</div>
        <div style={{display:"flex", gap:8, alignItems:"center"}}>
          <input type="number" min="1" className="ifield" value={dlc} onChange={e => setDlc(e.target.value)} style={{fontSize:22, textAlign:"center", maxWidth:120}}/>
          <span style={{fontSize:16, fontWeight:700}}>jours</span>
          <button className="btnS" disabled={!(parseInt(dlc) > 0)} onClick={() => { onDlc(parseInt(dlc)); setFlash("✓ Durée enregistrée"); setTimeout(() => setFlash(""), 2000); }}>Enregistrer</button>
        </div>
        <div style={{fontSize:13, color:"#94a3b8"}}>Affichée à la clôture du cycle pour l'étiquette.</div>
      </div>
    </div>
  );
}

// MODULE RÉCEPTION
// ══════════════════════════════════════════════
const isSameMonth=(iso)=>{const d=new Date(iso);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();};
const isWithin7Days=(iso)=>{return(Date.now()-new Date(iso).getTime())<7*24*3600*1000;};
function ModuleNettoyage({nettoyages,onSave,autoOpen,agents,pndPlan:pndProp}){
  const [mode,setMode]=useState("today");
  const [agent,setAgent]=useState((agents||AGENTS_DEFAULT)[0]);

  useEffect(()=>{ if(autoOpen) setMode("today"); },[autoOpen]);

  const today=todayS();
  const PND_PLAN=pndProp||PND_DEFAULT;
  const nAuj=nettoyages.filter(n=>sameKDay(n.ts));
  const isValidatedToday=(id)=>nAuj.some(n=>n.tacheId===id);
  // Hebdo = fait dans les 7 derniers jours, Mensuel = fait ce mois civil
  const isValidatedPeriod=(tache)=>{
    const prev=nettoyages.filter(n=>n.tacheId===tache.id);
    if(!prev.length) return null;
    const last=prev.sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
    if(tache.freq==="Journalier") return isValidatedToday(tache.id)?last:null;
    if(tache.freq==="Hebdomadaire") return isWithin7Days(last.ts)?last:null;
    if(tache.freq==="Mensuel") return isSameMonth(last.ts)?last:null;
    return null;
  };
  const toggle=async(tache)=>{
    const done=isValidatedPeriod(tache);
    if(done){
      // Seulement déverrouillable pour journalier
      if(tache.freq!=="Journalier") return;
      await onSave(nettoyages.filter(n=>!(n.tacheId===tache.id&&new Date(n.ts).toDateString()===today)));
    } else {
      await onSave([...nettoyages,{id:Date.now(),ts:ts(),tacheId:tache.id,zone:tache.zone,tache:tache.tache,freq:tache.freq,agent}]);
    }
  };
  const isValidated=(id)=>!!isValidatedPeriod(PND_PLAN.find(p=>p.id===id)||{});
  const csv=()=>dlCSV(nettoyages.map(n=>({"Date":fDate(n.ts),"Heure":fTime(n.ts),"Zone":n.zone,"Tâche":n.tache,"Fréquence":n.freq,"Agent":n.agent})),`nettoyage_${new Date().toISOString().slice(0,10)}.csv`);
  const FREQS=["Journalier","Hebdomadaire","Mensuel"];
  const grouped=FREQS.map(f=>({freq:f,taches:PND_PLAN.filter(p=>p.freq===f)}));
  const totalJour=PND_PLAN.filter(p=>p.freq==="Journalier").length;
  const doneJour=PND_PLAN.filter(p=>p.freq==="Journalier"&&isValidated(p.id)).length;
  const byDate={};
  nettoyages.forEach(n=>{ const d=fDate(n.ts); if(!byDate[d]) byDate[d]=[]; byDate[d].push(n); });
  const histDates=Object.keys(byDate).sort((a,b)=>new Date(b.split("/").reverse().join("-"))-new Date(a.split("/").reverse().join("-")));
  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <R2><span style={{fontSize:28,fontWeight:900,color:"#1e293b"}}>🧹 Nettoyage & Désinfection</span><button className="btnS" onClick={csv}>↓ CSV</button></R2>
      <div style={{background:"#ffffff",border:`2px solid ${doneJour===totalJour?"#22c55e":"#1e293b"}`,borderRadius:14,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:15,fontWeight:800,color:"#64748b",textTransform:"uppercase",letterSpacing:.8}}>Tâches du jour</div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:20,fontWeight:700,color:doneJour===totalJour?"#22c55e":"#f59e0b"}}>{doneJour}/{totalJour}</div>
        </div>
        <div style={{height:12,background:"#1e293b",borderRadius:6,overflow:"hidden"}}><div style={{height:"100%",borderRadius:6,background:doneJour===totalJour?"#22c55e":"#f59e0b",width:`${Math.round(doneJour/totalJour*100)}%`,transition:"width .4s"}}/></div>
        <div style={{fontSize:14,color:doneJour===totalJour?"#22c55e":"#f59e0b",marginTop:8,fontWeight:700}}>
          {doneJour===totalJour?"✅ Toutes les tâches du jour sont faites !":
           `${totalJour-doneJour} tâche${totalJour-doneJour>1?"s":""} restante${totalJour-doneJour>1?"s":""}`}
        </div>
      </div>
      <FB label="Qui valide ?"><ChipR opts={agents||AGENTS_DEFAULT} active={agent} onChange={setAgent}/></FB>
      <TBar opts={[{id:"today",label:"✅ Checklist"},{id:"plan",label:"📋 Plan complet"},{id:"hist",label:"🕐 Historique"}]} active={mode} onChange={setMode}/>
      {mode==="today"&&(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {grouped.map(({freq,taches})=>(
            <div key={freq}>
              <div style={{fontSize:14,fontWeight:900,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,marginTop:4,
                color:freq==="Journalier"?"#f59e0b":freq==="Hebdomadaire"?"#60a5fa":"#a78bfa"}}>{freq}</div>
              {taches.map(t=>{
                const val=isValidatedPeriod(t);
                const done=!!val;
                const locked=done&&t.freq!=="Journalier";
                return(
                  <div key={t.id} className={`pndRow${done?" done":""}`}
                    onClick={()=>!locked&&toggle(t)}
                    style={{opacity:1,cursor:locked?"default":"pointer"}}>
                    <div style={{display:"flex",alignItems:"flex-start",gap:14}}>
                      <div style={{width:30,height:30,borderRadius:8,
                        border:`3px solid ${done?"#22c55e":"#cbd5e1"}`,
                        background:done?"#22c55e":"transparent",
                        display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2,transition:"all .2s"}}>
                        {done&&<span style={{color:"#fff",fontWeight:900,fontSize:16}}>{locked?"🔒":"✓"}</span>}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:16,fontWeight:700,color:done?"#15803d":"#1e293b",lineHeight:1.3}}>{t.zone} — {t.tache}</div>
                        <div style={{fontSize:13,color:"#64748b",marginTop:4,lineHeight:1.5}}>{t.moment} · {t.produit} ({t.dilution})</div>
                        {done&&val&&(
                          <div style={{fontSize:13,color:"#16a34a",marginTop:4,fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
                            ✓ Fait le {fDate(val.ts)} à {fTime(val.ts)} · {val.agent}
                            {locked&&<span style={{fontSize:11,color:"#94a3b8",fontWeight:600}}>
                              {t.freq==="Hebdomadaire"?"(verrouillé 7 jours)":"(verrouillé ce mois)"}
                            </span>}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
      {mode==="plan"&&(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{background:"#f0f7ff",border:"1px solid #93c5fd",borderRadius:12,padding:"10px 14px",fontSize:14,color:"#1e293b",fontWeight:600}}>Document de référence · CE 852/2004 Annexe II Ch. I · Arrêté 21/12/2009</div>
          {grouped.map(({freq,taches})=>(
            <div key={freq}>
              <div style={{fontSize:14,fontWeight:900,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8,color:freq==="Journalier"?"#f59e0b":freq==="Hebdomadaire"?"#60a5fa":"#a78bfa"}}>{freq} — {taches.length} tâches</div>
              <div className="card" style={{padding:14}}>
                {taches.map((t,i)=>(
                  <div key={t.id} style={{padding:"12px 0",borderBottom:i<taches.length-1?"1px solid #e2e8f0":"none"}}>
                    <div style={{fontSize:16,fontWeight:700,color:"#1e293b"}}>{t.zone} — {t.tache}</div>
                    <div style={{fontSize:13,color:"#94a3b8",marginTop:4,lineHeight:1.7}}>🕐 {t.moment} · 🧴 {t.produit} ({t.dilution})</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
      {mode==="hist"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {histDates.length===0?<div className="card"><Empty/></div>:histDates.map(d=>{
            const items=byDate[d];
            const jourT=items.filter(i=>PND_PLAN.find(p=>p.id===i.tacheId)?.freq==="Journalier");
            const pct=totalJour>0?Math.round(jourT.length/totalJour*100):0;
            return(
              <div key={d} className="card" style={{padding:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{fontSize:16,fontWeight:700}}>{d}</div>
                  <div style={{fontSize:14,fontWeight:900,color:pct===100?"#22c55e":"#f59e0b"}}>{jourT.length}/{totalJour} jour. · {pct}%</div>
                </div>
                {items.map((n,i)=>(
                  <div key={i} style={{fontSize:13,color:"#64748b",borderTop:"1px solid #e2e8f0",padding:"6px 0"}}>
                    <span style={{color:"#64748b",fontWeight:700}}>{n.zone}</span> — {n.tache} · {fTime(n.ts)} · {n.agent}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ModuleNC({ncs,onSave,autoOpen,agents}){
  const [showForm,setShowForm]=useState(false);
  const [edit,setEdit]=useState(null);
  const [cat,setCat]=useState(CATEGORIES_NC[0]);
  const [desc,setDesc]=useState("");
  const [action,setAction]=useState("");
  const [agent,setAgent]=useState((agents||AGENTS_DEFAULT)[0]);
  const [flash,setFlash]=useState(false);
  const [showArchives,setShowArchives]=useState(false);

  useEffect(()=>{ if(autoOpen) setShowForm(true); },[autoOpen]);

  const submit=async()=>{
    if(!desc) return;
    await onSave([...ncs,{id:Date.now(),ts:ts(),categorie:cat,description:desc,action,agent,statut:"Ouvert"}]);

  const toggle=async(id)=>onSave(ncs.map(n=>n.id===id?{...n,statut:n.statut==="Ouvert"?"Clôturé":"Ouvert"}:n));
  const archiver=async(id)=>{ if(window.confirm("Archiver ce signalement ? Il sera masqué mais conservé.")) await onSave(ncs.map(n=>n.id===id?{...n,statut:"Archivé"}:n)); };
  const del=async(id)=>{ if(window.confirm("Supprimer ce signalement ?")) await onSave(ncs.filter(n=>n.id!==id)); };
  const csv=()=>dlCSV(ncs.map(n=>({"Date":fDate(n.ts),"Heure":fTime(n.ts),"Catégorie":n.categorie,"Description":n.description,"Action corrective":n.action,"Agent":n.agent,"Statut":n.statut})),`nonconformites_${new Date().toISOString().slice(0,10)}.csv`);
  const ouvertes=ncs.filter(n=>n.statut==="Ouvert");
  const cloturees=ncs.filter(n=>n.statut==="Clôturé");

    <div style={{display:"flex",flexDirection:"column",gap:16}}>

        {[{label:"Ouverts",v:ouvertes.length,color:"#dc2626",bg:ouvertes.length>0?"#fef2f2":"#ffffff"},{label:"Résolus",v:cloturees.length,color:"#16a34a",bg:"#ffffff"}].map(({label,v,color,bg})=>(
          <div key={label} style={{background:bg,border:`2px solid ${v>0&&label==="Ouverts"?"#ef4444":"#1e293b"}`,borderRadius:14,padding:16,textAlign:"center"}}>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:44,fontWeight:700,color,lineHeight:1}}>{v}</div>
            <div style={{fontSize:14,color:"#94a3b8",textTransform:"uppercase",letterSpacing:.5,fontWeight:700,marginTop:4}}>{label}</div>
          </div>
        ))}
      </div>
      {!showForm?(
        <button className="btnP" onClick={()=>setShowForm(true)} style={{background:flash?"#22c55e":"#ef4444",color:"#fff"}}>
          {flash?"✅ Signalement enregistré !":"⚠️ Signaler un problème"}
        </button>
      ):(
        <div className="card" style={{display:"flex",flexDirection:"column",gap:16,border:"2px solid #f59e0b33"}}>
          <div style={{fontSize:20,fontWeight:900,color:"#f59e0b",letterSpacing:.5}}>⚠️ NOUVEAU PROBLÈME</div>
          <FB label="Type de problème">
            <select className="ifield" value={cat} onChange={e=>setCat(e.target.value)}>{CATEGORIES_NC.map(c=><option key={c} value={c}>{c}</option>)}</select>

          <FB label="Description précise" sub="Quoi ? Où ? Quand ? Dans quel contexte ?">

          </FB>
          <FB label="Ce qui a été fait pour corriger">
            <textarea className="ifield" rows={2} value={action} onChange={e=>setAction(e.target.value)} placeholder="ex. Produits transférés en Frigo 1. Technicien appelé. Frigo mis hors service..."/>

          <div style={{display:"flex",gap:12}}>

            <button className="btnP" style={{flex:2}} onClick={submit} disabled={!desc}>💾 Enregistrer</button>

      {ouvertes.length>0&&(
        <>
          <div style={{fontSize:13,color:"#dc2626",textTransform:"uppercase",letterSpacing:1.5,fontWeight:900}}>● Problèmes ouverts ({ouvertes.length})</div>

        </>
      )}
      {cloturees.length>0&&(
        <>
          <div style={{fontSize:13,color:"#16a34a",textTransform:"uppercase",letterSpacing:1.5,fontWeight:900}}>✓ Problèmes résolus ({cloturees.length})</div>
          {cloturees.slice().reverse().map(n=><NCRow key={n.id} n={n} onToggle={toggle} onEdit={()=>setEdit(n)} onDel={()=>del(n.id)} onArchive={archiver}/>)}
        </>
      )}
      {archivees.length>0&&(
        <>
          <button onClick={()=>setShowArchives(!showArchives)} style={{background:"transparent",border:"1px solid #e2e8f0",borderRadius:10,padding:"10px 14px",color:"#94a3b8",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",width:"100%",textAlign:"left"}}>
            {showArchives?"▾":"▸"} Archives ({archivees.length} signalement{archivees.length>1?"s":""})
          </button>
          {showArchives&&archivees.slice().reverse().map(n=><NCRow key={n.id} n={n} onToggle={toggle} onEdit={()=>setEdit(n)} onDel={()=>del(n.id)}/>)}
        </>
      )}
      {edit&&<Modal title="✏️ Modifier ce signalement" onClose={()=>setEdit(null)}><EditNC item={edit} agents={agents} onSave={saveEdit} onClose={()=>setEdit(null)}/></Modal>}
    </div>
  );
}
function NCRow({n,onToggle,onEdit,onDel,onArchive}){
  const open=n.statut==="Ouvert";
  return(
    <div style={{background:"#ffffff",border:`2px solid ${open?"#ef4444":"#1e293b"}`,borderLeft:`6px solid ${open?"#ef4444":"#22c55e"}`,borderRadius:14,padding:14,marginBottom:12}}>

        <div style={{display:"flex",flexDirection:"column",gap:7,flexShrink:0}}>

      </div>
    </div>

function EditNC({item,onSave,onClose,agents}){

}



// ══════ VUE SYNTHÈSE SEMAINE ══════════════════
function ModuleSemaine({temps,huiles,services,nettoyages,ncs}){
  // Générer les 7 derniers jours de cuisine
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i); d.setHours(12,0,0,0);
    days.push(kitchenDay(d));
  }
  const pndJour=(pndLoad()||PND_DEFAULT).filter(p=>p.freq==="Journalier");

  const statForDay=(day)=>{
    const tD=temps.filter(t=>kitchenDay(new Date(t.ts))===day);
    const sD=services.filter(s=>kitchenDay(new Date(s.ts))===day);
    const hD=huiles.filter(h=>kitchenDay(new Date(h.ts))===day);
    const nD=nettoyages.filter(n=>kitchenDay(new Date(n.ts))===day);
    const ncD=ncs.filter(n=>kitchenDay(new Date(n.ts))===day&&n.statut==="Ouvert");
    const pndDoneD=pndJour.filter(p=>nD.some(n=>n.tacheId===p.id));
    const tKO=tD.filter(t=>t.ok===false).length;
    const sKO=sD.filter(s=>s.ok===false).length;
    return {
      tCount:tD.length, tKO,
      sCount:sD.length, sKO,
      hCount:hD.length,
      pndPct:pndJour.length>0?Math.round(pndDoneD.length/pndJour.length*100):null,
      ncCount:ncD.length,
      isEmpty:tD.length===0&&sD.length===0&&hD.length===0,
    };
  };

  const JOURS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  const today=todayS();

  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{fontSize:28,fontWeight:900,color:"#1e293b"}}>📅 Synthèse semaine</div>
      <div style={{fontSize:13,color:"#64748b"}}>Vue des 7 derniers jours — vérifier les jours incomplets.</div>

      {days.map(day=>{
        const d=new Date(day);
        const isToday=day===today;
        const st=statForDay(day);
        const nomJour=JOURS[d.getDay()];
        const numJour=d.getDate();
        const hasProb=st.tKO>0||st.sKO>0||st.ncCount>0||(st.pndPct!==null&&st.pndPct<100);
        const statusColor=st.isEmpty?"#94a3b8":hasProb?"#ef4444":"#22c55e";
        const statusBg=st.isEmpty?"#f8fafc":hasProb?"#fef2f2":"#f0fdf4";
        return(
          <div key={day} style={{background:statusBg,border:`2px solid ${isToday?"#f59e0b":statusColor}`,borderRadius:14,padding:14,position:"relative"}}>
            {isToday&&<div style={{position:"absolute",top:-10,left:16,background:"#f59e0b",color:"#1e293b",fontSize:11,fontWeight:900,padding:"2px 10px",borderRadius:8,textTransform:"uppercase",letterSpacing:1}}>Aujourd'hui</div>}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:st.isEmpty?0:10}}>
              <div>
                <span style={{fontSize:20,fontWeight:900,color:"#1e293b"}}>{nomJour} {numJour}</span>
                <span style={{fontSize:13,color:"#64748b",marginLeft:8}}>{d.toLocaleDateString("fr-FR",{month:"short"})}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {st.isEmpty?(
                  <span style={{fontSize:13,color:"#94a3b8",fontWeight:600}}>Aucune saisie</span>
                ):(
                  <div style={{width:10,height:10,borderRadius:"50%",background:statusColor}}/>
                )}
              </div>
            </div>
            {!st.isEmpty&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                {[
                  {icon:"🌡",label:"T° frigos",   v:st.tCount, ko:st.tKO,   req:2},
                  {icon:"🔥",label:"T° service",  v:st.sCount, ko:st.sKO,   req:1},
                  {icon:"⚗", label:"Huile",       v:st.hCount, ko:0,         req:1},
                  {icon:"🧹",label:"Ménage",       v:st.pndPct!==null?st.pndPct+"%":"—", ko:st.pndPct!==null&&st.pndPct<100?1:0, req:null},
                ].map(({icon,label,v,ko,req})=>{
                  const warn=ko>0||(req&&typeof v==="number"&&v<req);
                  return(
                    <div key={label} style={{background:"rgba(255,255,255,.7)",borderRadius:9,padding:"8px 10px",display:"flex",alignItems:"center",gap:7}}>
                      <span style={{fontSize:16}}>{icon}</span>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,color:"#64748b",fontWeight:600}}>{label}</div>
                        <div style={{fontSize:15,fontWeight:800,color:warn?"#dc2626":"#15803d"}}>{typeof v==="number"?v:v}{req&&typeof v==="number"?<span style={{fontSize:11,color:"#94a3b8",fontWeight:500}}>/{req}</span>:null}</div>
                      </div>
                      {warn&&<span style={{fontSize:14}}>⚠</span>}
                    </div>
                  );
                })}
                {st.ncCount>0&&(
                  <div style={{gridColumn:"1/-1",background:"#fef2f2",borderRadius:9,padding:"8px 10px",display:"flex",alignItems:"center",gap:7}}>
                    <span style={{fontSize:16}}>⚠️</span>
                    <div style={{fontSize:14,fontWeight:700,color:"#dc2626"}}>{st.ncCount} non-conformité{st.ncCount>1?"s":""} ouverte{st.ncCount>1?"s":""}</div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}

      <div style={{background:"#f0f7ff",border:"1px solid #bfdbfe",borderRadius:12,padding:"10px 14px",fontSize:13,color:"#1d4ed8",lineHeight:1.7}}>
        <b>Lecture :</b> 🟢 Tout bon · 🔴 Manques ou NC · ⚪ Aucune saisie ce jour
      </div>
    </div>
  );
}

function SettingsAgents({agents,onSave}){
  const [name,setName]=useState(""); const [flash,setFlash]=useState("");

  const rm=(a)=>{ if(agents.length<=1){setFlash("⚠ Minimum 1");setTimeout(()=>setFlash(""),2000);return;} if(window.confirm(`Retirer "${a}" ?`)) onSave(agents.filter(x=>x!==a)); };
  return(<div style={{display:"flex",flexDirection:"column",gap:10}}>
    <div style={{fontSize:13,color:"#64748b"}}>Ces noms apparaissent dans tous les modules pour identifier qui fait la saisie.</div>

      <button onClick={add} disabled={!name.trim()} style={{background:"#22c55e",border:"none",borderRadius:12,padding:"14px 18px",color:"#fff",fontFamily:"inherit",fontSize:16,fontWeight:900,cursor:"pointer",minWidth:70}}>+ Ajouter</button>

// ── Section Unités de stockage ──
function SettingsUnites({unites,onSave}){
  const [editId,setEditId]=useState(null);

  const [minT,setMinT]=useState("0"); const [maxT,setMaxT]=useState("4");
  const [flash,setFlash]=useState(""); const [showForm,setShowForm]=useState(false);
  const startEdit=(u)=>{ setEditId(u.id); setLabel(u.label); setType(u.type); setMinT(String(u.min)); setMaxT(String(u.max)); setShowForm(false); };
  const saveEdit=()=>{ const l=label.trim(); if(!l) return; onSave(unites.map(u=>u.id===editId?{...u,label:l,type,min:parseFloat(minT),max:parseFloat(maxT)}:u)); setEditId(null); setLabel(""); setFlash("✓ Modifié !"); setTimeout(()=>setFlash(""),2000); };
  const add=()=>{ const l=label.trim(); if(!l) return; onSave([...unites,{id:"u_"+Date.now(),label:l,type,min:parseFloat(minT),max:parseFloat(maxT)}]); setLabel(""); setShowForm(false); setFlash("✓ Ajouté !"); setTimeout(()=>setFlash(""),2000); };
  const rm=(id)=>{ if(unites.length<=1){setFlash("⚠ Minimum 1");setTimeout(()=>setFlash(""),2000);return;} if(window.confirm("Supprimer cette unité ?")) onSave(unites.filter(u=>u.id!==id)); };
  const TypeBtns=()=>(<div style={{display:"flex",gap:8}}>{["froid","congelation"].map(t=>(<button key={t} onClick={()=>{setType(t);if(t==="congelation"){setMinT("-30");setMaxT("-18");}else{setMinT("0");setMaxT("4");}}} className={`chip${type===t?" on":""}`} style={{flex:1}}>{t==="froid"?"❄ Froid positif":"🧊 Congélation"}</button>))}</div>);
  const TempFields=()=>(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><FB label="T° min (°C)"><input type="number" className="ifield" value={minT} onChange={e=>setMinT(e.target.value)} style={{textAlign:"center",fontSize:18,fontFamily:"'JetBrains Mono',monospace"}}/></FB><FB label="T° max (°C)"><input type="number" className="ifield" value={maxT} onChange={e=>setMaxT(e.target.value)} style={{textAlign:"center",fontSize:18,fontFamily:"'JetBrains Mono',monospace"}}/></FB></div>);
  return(<div style={{display:"flex",flexDirection:"column",gap:10}}>
    <div style={{fontSize:13,color:"#64748b"}}>Frigos, congélateurs et équipements — modifier le nom et les plages de température.</div>
    {unites.map(u=>(
      <div key={u.id}>
        {editId===u.id?(
          <div className="card" style={{display:"flex",flexDirection:"column",gap:10,border:"2px solid #f59e0b"}}>
            <div style={{fontSize:13,fontWeight:800,color:"#b45309",textTransform:"uppercase"}}>✏ Modifier — {u.label}</div>
            <input className="ifield" value={label} onChange={e=>setLabel(e.target.value)} placeholder="Nom de l'unité"/>
            <TypeBtns/><TempFields/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setEditId(null)} style={{flex:1,padding:"12px",background:"transparent",border:"1px solid #e2e8f0",borderRadius:10,color:"#94a3b8",fontFamily:"inherit",fontSize:14,cursor:"pointer",fontWeight:700}}>Annuler</button>
              <button onClick={saveEdit} disabled={!label.trim()} style={{flex:2,background:"#f59e0b",border:"none",borderRadius:12,padding:"12px",color:"#1e293b",fontFamily:"inherit",fontSize:15,fontWeight:900,cursor:"pointer"}}>💾 Sauvegarder</button>
